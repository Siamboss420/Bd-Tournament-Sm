<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BD TOURNAMENT SM - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
        
        @keyframes rgbGlow {
            0% { color: #3b82f6; text-shadow: 0 0 10px rgba(59, 130, 246, 0.7); border-color: rgba(59, 130, 246, 0.7); box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
            33% { color: #8b5cf6; text-shadow: 0 0 10px rgba(139, 92, 246, 0.7); border-color: rgba(139, 92, 246, 0.7); box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
            66% { color: #06b6d4; text-shadow: 0 0 10px rgba(6, 182, 212, 0.7); border-color: rgba(6, 182, 212, 0.7); box-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }
            100% { color: #3b82f6; text-shadow: 0 0 10px rgba(59, 130, 246, 0.7); border-color: rgba(59, 130, 246, 0.7); box-shadow: 0 0 20px rgba(59, 130, 246, 0.3); }
        }
        .rgb-text-glow { animation: rgbGlow 5s infinite; }
        .rgb-border-glow { animation: rgbGlow 5s infinite; background: linear-gradient(145deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%); border-width: 2px; backdrop-filter: blur(12px); }
        .card-bg { background: linear-gradient(145deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%); border: 1px solid rgba(59, 130, 246, 0.3); backdrop-filter: blur(12px); }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col justify-center items-center">

    <!-- Admin Login Box -->
    <div id="adminLoginBox" class="rgb-border-glow p-6 rounded-2xl w-full max-w-sm space-y-4 shadow-2xl">
        <div class="text-center space-y-1">
            <div class="w-14 h-14 bg-amber-600/20 text-amber-400 mx-auto rounded-xl flex items-center justify-center text-2xl border border-amber-500/40 rgb-text-glow">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2 class="text-lg font-extrabold rgb-text-glow">BD TOURNAMENT SM</h2>
            <p class="text-xs text-slate-400">Admin Panel Login</p>
        </div>
        <input type="text" id="adminUser" placeholder="Admin Username" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
        <div class="relative">
            <input type="password" id="adminPass" placeholder="Admin Password" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500 pr-10">
            <button type="button" onclick="toggleAdminPass()" class="absolute right-3 top-3.5 text-slate-400">
                <i id="adminEye" class="fa-solid fa-eye"></i>
            </button>
        </div>
        <button onclick="loginAdmin()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold text-sm text-white transition shadow-lg">Login to Panel</button>
    </div>

    <!-- Admin Dashboard (Hidden until login) -->
    <div id="adminDashboard" class="w-full max-w-4xl space-y-6 hidden">
        <div class="card-bg p-4 rounded-2xl flex justify-between items-center border border-amber-500/40">
            <div>
                <h1 class="text-xl font-extrabold rgb-text-glow">⚡ Admin Control Dashboard</h1>
                <p class="text-xs text-slate-400">Manage Tournaments, Custom Matches & Deposit Requests</p>
            </div>
            <button onclick="logoutAdmin()" class="bg-red-500/20 text-red-400 hover:bg-red-500 hover:text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-1">
                <i class="fa-solid fa-arrow-left"></i><span>Logout</span>
            </button>
        </div>

        <!-- Add Tournament / Custom Match Section -->
        <div class="card-bg p-5 rounded-2xl space-y-4 border border-blue-500/40">
            <h3 class="text-sm font-bold text-blue-400"><i class="fa-solid fa-circle-plus mr-1"></i> নতুন টুর্নামেন্ট বা কাস্টম ম্যাচ তৈরি করুন</h3>
            <input type="text" id="admTitle" placeholder="Match Title (e.g. Solo Custom Match)" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm text-white">
            <div class="grid grid-cols-2 gap-3">
                <select id="admType" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm text-white">
                    <option value="CUSTOM">CUSTOM</option>
                    <option value="CS">CS 4v4</option>
                    <option value="BR">BR Mode</option>
                    <option value="LONE">Lone Wolf</option>
                </select>
                <select id="admTeamType" class="w-full bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm text-white">
                    <option value="SOLO">SOLO</option>
                    <option value="DUO">DUO</option>
                    <option value="SQUAD">SQUAD</option>
                </select>
            </div>
            <div class="grid grid-cols-3 gap-3">
                <input type="text" id="admPrize" placeholder="Prize (e.g. 500)" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm text-white">
                <input type="number" id="admFee" placeholder="Entry Fee" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm text-white">
                <input type="number" id="admSlots" placeholder="Total Slots (e.g. 48)" class="bg-slate-800 border border-slate-700 p-3 rounded-xl text-sm text-white">
            </div>
            <button onclick="adminAddNewMatch()" class="w-full bg-blue-600 hover:bg-blue-700 py-3 rounded-xl font-bold text-sm text-white shadow-lg">Publish Match / Custom</button>
        </div>

        <!-- Deposit Requests Management -->
        <div class="card-bg p-5 rounded-2xl space-y-3 border border-emerald-500/40">
            <h3 class="text-sm font-bold text-emerald-400"><i class="fa-solid fa-wallet mr-1"></i> ইউজারের ডিপোজিট রিকোয়েস্ট (Nagad/bKash)</h3>
            <div id="adminRequestsList" class="space-y-2 max-h-60 overflow-y-auto">
                <p class="text-slate-500 text-center text-xs">কোনো পেন্ডিং ডিপোজিট নেই।</p>
            </div>
        </div>
    </div>

    <!-- JavaScript Control Logic -->
    <script>
        const ADMIN_USER = "SIAM TRADER'S";
        const ADMIN_PASS = "SAAMMEGHLA";

        function toggleAdminPass() {
            let passField = document.getElementById('adminPass');
            let eyeIcon = document.getElementById('adminEye');
            if (passField.type === "password") {
                passField.type = "text";
                eyeIcon.className = "fa-solid fa-eye-slash";
            } else {
                passField.type = "password";
                eyeIcon.className = "fa-solid fa-eye";
            }
        }

        function loginAdmin() {
            let u = document.getElementById('adminUser').value.trim();
            let p = document.getElementById('adminPass').value.trim();
            if(u === ADMIN_USER && p === ADMIN_PASS) {
                localStorage.setItem('sm_admin_logged', 'true');
                document.getElementById('adminLoginBox').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                loadAdminData();
            } else {
                alert("ভুল ইউজারনেম বা পাসওয়ার্ড!");
            }
        }

        function logoutAdmin() {
            localStorage.removeItem('sm_admin_logged');
            location.reload();
        }

        window.onload = function() {
            if(localStorage.getItem('sm_admin_logged') === 'true') {
                document.getElementById('adminLoginBox').classList.add('hidden');
                document.getElementById('adminDashboard').classList.remove('hidden');
                loadAdminData();
            }
        }

        function adminAddNewMatch() {
            let title = document.getElementById('admTitle').value.trim();
            let type = document.getElementById('admType').value;
            let teamType = document.getElementById('admTeamType').value;
            let prize = document.getElementById('admPrize').value.trim();
            let fee = Number(document.getElementById('admFee').value);
            let slots = Number(document.getElementById('admSlots').value) || 48;

            if(!title || !prize || isNaN(fee)) {
                alert("সব তথ্য সঠিকভাবে পূরণ করুন!");
                return;
            }

            let tournaments = JSON.parse(localStorage.getItem('sm_tournaments') || '[]');
            tournaments.push({
                id: Date.now(),
                title: title,
                type: type,
                teamType: teamType,
                prize: prize + " BDT",
                entryFee: fee,
                totalSlots: slots,
                participants: []
            });
            localStorage.setItem('sm_tournaments', JSON.stringify(tournaments));
            alert("সফলভাবে নতুন ম্যাচ বা কাস্টম যোগ করা হয়েছে!");
            document.getElementById('admTitle').value = "";
            document.getElementById('admPrize').value = "";
            document.getElementById('admFee').value = "";
        }

        function loadAdminData() {
            let listContainer = document.getElementById('adminRequestsList');
            if(!listContainer) return;
            listContainer.innerHTML = "";

            let deposits = JSON.parse(localStorage.getItem('sm_admin_deposits') || '[]');
            let pendingDeps = deposits.filter(d => d.status === 'Pending');

            if(pendingDeps.length === 0) {
                listContainer.innerHTML = `<p class="text-slate-500 text-center text-xs">কোনো পেন্ডিং রিকোয়েস্ট নেই।</p>`;
                return;
            }

            pendingDeps.forEach(dep => {
                listContainer.innerHTML += `
                    <div class="bg-slate-900 p-3 rounded-xl flex justify-between items-center border border-slate-800 text-xs">
                        <div>
                            <p class="font-bold text-white">${dep.name} - ৳${dep.amount}</p>
                            <p class="text-[10px] text-slate-400">TrxID: ${dep.trx} | Phone: ${dep.phone}</p>
                        </div>
                        <button onclick="approveDeposit(${dep.id})" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Approve</button>
                    </div>
                `;
            });
        }

        function approveDeposit(depId) {
            let deposits = JSON.parse(localStorage.getItem('sm_admin_deposits') || '[]');
            let dep = deposits.find(d => d.id === depId);
            if(dep) {
                dep.status = 'Approved';
                localStorage.setItem('sm_admin_deposits', JSON.stringify(deposits));
                
                let users = JSON.parse(localStorage.getItem('sm_users') || '[]');
                let targetUser = users.find(u => u.phone === dep.phone);
                if(targetUser) {
                    targetUser.balance = Number(targetUser.balance || 0) + Number(dep.amount);
                    localStorage.setItem('sm_users', JSON.stringify(users));
                }
                alert("ডিপোজিট সফলভাবে অ্যাপ্রুভ করা হয়েছে!");
                loadAdminData();
            }
        }
    </script>
</body>
</html>
